[platformio]
default_envs = esp32-s3-n16r8   ; only build main env by default

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ===== N16R8 Memory (16MB flash, 8MB Octal PSRAM) =====
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; ===== Build flags =====
; -UARDUINO_USB_MODE overrides the board JSON's -DARDUINO_USB_MODE=1 which was causing
; TinyUSB to initialise and call __pinMode() with pin 255 (cast from -1 SPI defaults),
; crashing the boot before setup() ever ran.
build_flags =
    -DBOARD_HAS_PSRAM
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0

; ===== Libraries =====
lib_deps =
    zinggjm/GxEPD2 @ ^1.5.0
    adafruit/Adafruit GFX Library @ ^1.11.5
    greiman/SdFat @ ^2.2.3
    earlephilhower/ESP8266Audio @ ^1.9.7
    tzapu/WiFiManager @ ^2.0.17

; ===== Standalone SD test (spare devkit, no display needed) =====
; Flash with:  pio run -e sd-test --target upload
[env:sd-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DSD_TEST
lib_deps =
    greiman/SdFat @ ^2.2.3
build_src_filter = +<sd_test.cpp>
